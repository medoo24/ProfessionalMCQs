<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QnA Hub</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- App styles -->
  <link rel="stylesheet" href="src/styles/main.css?v=3">

  <!-- ── CDN DEPENDENCIES ────────────────────────────────────────────────── -->
  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone (for JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- PDF export -->
  <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <!-- DOCX export -->
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <script>window.docxLib = window.docx;</script>

  <!-- ── FIREBASE CDN (compat version) ──────────────────────────────────── -->
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>

  <!-- Expose Firebase modules to our scripts -->
  <script>
    window.FirebaseApp  = { initializeApp: firebase.initializeApp.bind(firebase) };
    window.FirebaseAuth = firebase.auth;
    window.FirestoreLib = firebase.firestore;
  </script>
</head>
<body>
  <!-- Reading progress rail -->
  <div id="read-rail"><div id="read-fill"></div></div>

  <!-- React root -->
  <div id="root"></div>

  <!-- ── APP SCRIPTS (loaded in dependency order) ───────────────────────── -->

  <!-- 1. Constants -->
  <script type="text/babel" src="src/config.js?v=5"></script>

  <!-- 2. Utilities -->
  <script type="text/babel" src="src/parser.js?v=5"></script>
  <script type="text/babel" src="src/sm2.js?v=5"></script>
  <script type="text/babel" src="src/query.js?v=5"></script>
  <script type="text/babel" src="src/storage.js?v=5"></script>

  <!-- 3. Firebase -->
  <script type="text/babel" src="src/firebase.js?v=5"></script>

  <!-- 4. Icons -->
  <script type="text/babel" src="src/components/Icons.jsx?v=5"></script>

  <!-- 5. UI Components -->
  <script type="text/babel" src="src/components/ThemePicker.jsx?v=5"></script>
  <script type="text/babel" src="src/components/ShortcutsPanel.jsx?v=7"></script>
  <script type="text/babel" src="src/components/CollectionsModal.jsx?v=5"></script>
  <script type="text/babel" src="src/components/PracticeMode.jsx?v=5"></script>
  <script type="text/babel" src="src/components/ReportModal.jsx?v=5"></script>
  <script type="text/babel" src="src/components/NarrationMode.jsx?v=7"></script>
  <script type="text/babel" src="src/components/TVMode.jsx?v=5"></script>
  <script type="text/babel" src="src/components/ExamLauncher.jsx?v=5"></script>

  <!-- 6. Auth components -->
  <script type="text/babel" src="src/components/Auth/LoginPage.jsx?v=5"></script>
  <script type="text/babel" src="src/components/Auth/UserMenu.jsx?v=5"></script>

  <!-- 7. Main App (renders root) -->
  <script type="text/babel" src="src/components/App.jsx?v=7"></script>
</body>
</html>
